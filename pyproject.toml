[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    "build_full_notebook.py",
    "generate_notebook.py",
    "generate_unit3_unit4_notebook.py"
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "F841"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = ["attr-defined", "assignment", "has-type", "var-annotated"]
exclude = [
    "venv",
    ".venv",
    "build_full_notebook.py",
    "generate_notebook.py",
    "generate_unit3_unit4_notebook.py"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
